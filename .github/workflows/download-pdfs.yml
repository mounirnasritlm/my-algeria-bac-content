name: Download & Process PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/sources/inventory/*.json'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pypdf
        run: pip install pypdf

      - name: Download PDFs
        run: python tools/download_pdfs.py

      - name: Extract text
        if: success() || failure()
        run: python tools/process_content.py extract

      - name: Dedup
        if: success() || failure()
        run: python tools/process_content.py dedup

      - name: Classify
        if: success() || failure()
        run: python tools/process_content.py classify

      - name: Map to curriculum
        if: success() || failure()
        run: python tools/process_content.py map

      - name: Build release
        if: success() || failure()
        run: python tools/process_content.py build

      - name: Validate
        if: success() || failure()
        run: python tools/process_content.py validate

      - name: Commit all results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            PDF_COUNT=$(find content/sources/pdf -name '*.pdf' 2>/dev/null | wc -l || echo 0)
            DOC_COUNT=$(python -c "import json; d=json.load(open('content/releases/1.0.0/app_bundle/documents.json')); print(len(d))" 2>/dev/null || echo "?")
            git commit -m "Pipeline: ${PDF_COUNT} PDFs, ${DOC_COUNT} documents [skip ci]"
            git push
          fi
