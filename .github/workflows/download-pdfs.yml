name: Download PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/sources/inventory/*.json'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download PDFs
        run: python tools/download_pdfs.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/sources/pdf/ content/sources/downloaded.json content/sources/url_index.json content/sources/failed_downloads.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(find content/sources/pdf -name '*.pdf' | wc -l)
            git commit -m "Download PDFs: ${COUNT} unique files"
            git push
          fi
